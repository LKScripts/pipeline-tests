name: Testes da Calculadora

on:
  push:
    branches:
      - main

jobs:
  teste_soma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Compilar teste de soma
        run: g++ -std=c++17 -o teste_soma teste_soma.cpp calculadora.cpp
      - name: Rodar teste de soma
        run: ./teste_soma

  analise_segredos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Rodar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        
  teste_subtracao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Compilar teste de subtração
        run: g++ -std=c++17 -o teste_subtracao teste_subtracao.cpp calculadora.cpp
      - name: Rodar teste de subtração
        run: ./teste_subtracao

  teste_multiplicacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Compilar teste de multiplicação
        run: g++ -std=c++17 -o teste_multiplicacao teste_multiplicacao.cpp calculadora.cpp
      - name: Rodar teste de multiplicação
        run: ./teste_multiplicacao

  teste_divisao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Compilar teste de divisão
        run: g++ -std=c++17 -o teste_divisao teste_divisao.cpp calculadora.cpp
      - name: Rodar teste de divisão
        run: ./teste_divisao

  cobertura:
    runs-on: ubuntu-latest
    needs: [teste_soma, teste_subtracao, teste_multiplicacao, teste_divisao]
    outputs:
      coverage: ${{ steps.verificar_cobertura.outputs.coverage }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar lcov e bc
        run: sudo apt-get update && sudo apt-get install -y lcov bc

      - name: Compilar calculadora com cobertura
        run: g++ -std=c++17 --coverage -c calculadora.cpp -o calculadora.o

      - name: Compilar os 4 testes linkando o mesmo objeto instrumentado
        run: |
          g++ -std=c++17 --coverage teste_soma.cpp calculadora.o -o teste_soma
          g++ -std=c++17 --coverage teste_subtracao.cpp calculadora.o -o teste_subtracao
          g++ -std=c++17 --coverage teste_multiplicacao.cpp calculadora.o -o teste_multiplicacao
          g++ -std=c++17 --coverage teste_divisao.cpp calculadora.o -o teste_divisao

      - name: Rodar os 4 testes (acumulando cobertura)
        run: |
          ./teste_soma
          ./teste_subtracao
          ./teste_multiplicacao
          ./teste_divisao

      - name: Capturar dados de cobertura
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --extract coverage.info '*/calculadora.cpp' --output-file coverage_calculadora.info

      - name: Gerar relatório HTML
        run: genhtml coverage_calculadora.info --output-directory coverage_html

      - name: Calcular percentual de cobertura
        id: verificar_cobertura
        run: |
          COVERAGE=$(lcov --summary coverage_calculadora.info | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Cobertura atual: $COVERAGE%"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::warning::Cobertura de $COVERAGE% de 80%. O deploy sera bloqueado."
          else
            echo "Cobertura de $COVERAGE% atinge o minimo de 80%."
          fi

      - name: Upload do relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: coverage_html

  deploy:
    runs-on: ubuntu-latest
    needs: [teste_soma, teste_subtracao, teste_multiplicacao, teste_divisao, cobertura]
    if: ${{ fromJSON(needs.cobertura.outputs.coverage) >= 80 }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Deploy
        run: echo "Testes e cobertura (${{ needs.cobertura.outputs.coverage }}%) passaram, fazendo deploy"